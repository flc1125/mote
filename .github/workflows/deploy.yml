name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source: main, stable vX.Y.Z tag, or full main-history SHA'
        type: string
        default: main
        required: true
      environment:
        description: Target environment
        type: choice
        options: [production, access-test]
        default: production
        required: true
      write_smoke:
        description: 'Publish one permanent public smoke document (no automatic retry)'
        type: boolean
        default: false

permissions:
  # Ceiling for the reusable preparation workflow's tag-only Release preflight.
  # Actual manual jobs keep contents: read; credentials remain in direct jobs.
  contents: write
  actions: read
  deployments: write

# Held by the caller through preparation, deployment, and optional write smoke.
# release.yml holds the same production group through npm/Release finalization.
concurrency:
  group: mote-${{ inputs.environment }}
  cancel-in-progress: false

env:
  MOTE_REF: ${{ inputs.ref }}
  MOTE_ENVIRONMENT: ${{ inputs.environment }}
  MOTE_WRITE_SMOKE: ${{ inputs.write_smoke }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      ref: ${{ inputs.ref }}
      environment: ${{ inputs.environment }}
      write_smoke: ${{ inputs.write_smoke }}

  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      target_sha: ${{ needs.prepare.outputs.target_sha }}
      manifest_digest: ${{ needs.prepare.outputs.manifest_digest }}
    env:
      MOTE_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      MOTE_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
      MOTE_RELEASE_PREFLIGHT_IDENTITY: ${{ needs.prepare.outputs.release_preflight_identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Trusted tooling only; Cloudflare secrets exist only on the deploy step.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mote-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-prepared
      - run: node scripts/deploy/action.mjs deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOTE_DEPLOY_ENABLED: ${{ vars.MOTE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOTE_SMOKE_DOCUMENT_ID: ${{ vars.MOTE_SMOKE_DOCUMENT_ID }}
          MOTE_SMOKE_ASSET_ID: ${{ vars.MOTE_SMOKE_ASSET_ID }}
          MOTE_SMOKE_ASSET_SHA256: ${{ vars.MOTE_SMOKE_ASSET_SHA256 }}
          MOTE_HAS_SERVICE_ID: ${{ secrets.MOTE_SERVICE_CLIENT_ID != '' }}
          MOTE_HAS_SERVICE_SECRET: ${{ secrets.MOTE_SERVICE_CLIENT_SECRET != '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-deploy-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-deployment-result/
          if-no-files-found: warn
          retention-days: 90

  write-smoke:
    needs: [prepare, deploy]
    if: always() && inputs.write_smoke && needs.prepare.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      MOTE_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      MOTE_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mote-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-prepared
      - run: node scripts/deploy/action.mjs install-cli
      - run: node scripts/deploy/action.mjs write
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOTE_DEPLOY_ENABLED: ${{ vars.MOTE_DEPLOY_ENABLED }}
          MOTE_SERVICE_CLIENT_ID: ${{ secrets.MOTE_SERVICE_CLIENT_ID }}
          MOTE_SERVICE_CLIENT_SECRET: ${{ secrets.MOTE_SERVICE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-write-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-deployment-result/
          if-no-files-found: warn
          retention-days: 90
