name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Builds both formal Workers in both environments, packs the CLI once,
      # verifies that tarball, then checks prebuilt upload bytes without secrets.
      - run: pnpm artifacts:prepare --environment production

      - run: pnpm format:check
