name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Runs credential-free Wrangler dry-runs for both formal Workers in both
      # environments, then validates the packed CLI exactly as release does.
      - run: pnpm build

      - run: pnpm --filter @mote/cli test:package

      - run: pnpm format:check
