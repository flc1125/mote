name: Diagnose test secret availability

on:
  workflow_dispatch:

permissions: {}

# Serialize with test deployments, without changing their enable switch.
concurrency:
  group: mote-access-test
  cancel-in-progress: false

# Temporary diagnostic. Remove after the environment-secret issue is resolved.
# This creates GitHub environment records, but makes no Cloudflare requests.
jobs:
  direct:
    if: github.repository == 'flc1125/mote' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: access-test
    steps:
      - name: Report direct-task secret presence
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          case "$TOKEN_PRESENT" in
            true|false) printf '%s\n' "$TOKEN_PRESENT" ;;
            *) exit 1 ;;
          esac

  reusable:
    if: github.repository == 'flc1125/mote' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_diagnose-secrets.yml
    # Historical control: no caller mapping/inheritance.

  after-reusable:
    needs: reusable
    if: github.repository == 'flc1125/mote' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: access-test
    steps:
      - name: Report direct-task secret presence after reusable dependency
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          case "$TOKEN_PRESENT" in
            true|false) printf '%s\n' "$TOKEN_PRESENT" ;;
            *) exit 1 ;;
          esac
