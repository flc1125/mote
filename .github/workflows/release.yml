name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Same caller-owned lock as deploy.yml, held through npm and Release finalization.
concurrency:
  group: mote-production
  cancel-in-progress: false

env:
  MOTE_REF: ${{ github.ref_name }}
  MOTE_ENVIRONMENT: production
  MOTE_WRITE_SMOKE: 'false'

jobs:
  prepare:
    permissions:
      # Permission ceiling for the isolated draft-Release preflight job only.
      # Preparation has no Environment; actual deployment is a direct job.
      contents: write
      actions: read
      deployments: read
    uses: ./.github/workflows/_deploy.yml
    with:
      ref: ${{ github.ref_name }}
      environment: production
      write_smoke: false

  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      target_sha: ${{ needs.prepare.outputs.target_sha }}
      manifest_digest: ${{ needs.prepare.outputs.manifest_digest }}
    env:
      MOTE_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      MOTE_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
      MOTE_RELEASE_PREFLIGHT_IDENTITY: ${{ needs.prepare.outputs.release_preflight_identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Trusted tooling only; Cloudflare secrets exist only on the deploy step.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mote-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-prepared
      - run: node scripts/deploy/action.mjs deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOTE_DEPLOY_ENABLED: ${{ vars.MOTE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOTE_SMOKE_DOCUMENT_ID: ${{ vars.MOTE_SMOKE_DOCUMENT_ID }}
          MOTE_SMOKE_ASSET_ID: ${{ vars.MOTE_SMOKE_ASSET_ID }}
          MOTE_SMOKE_ASSET_SHA256: ${{ vars.MOTE_SMOKE_ASSET_SHA256 }}
          MOTE_HAS_SERVICE_ID: ${{ secrets.MOTE_SERVICE_CLIENT_ID != '' }}
          MOTE_HAS_SERVICE_SECRET: ${{ secrets.MOTE_SERVICE_CLIENT_SECRET != '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-deploy-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-deployment-result/
          if-no-files-found: warn
          retention-days: 90

  npm:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep npm directly in release.yml, with no new Environment claim, to retain
    # the original trusted-publisher workflow identity. No Cloudflare secrets here.
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
    env:
      MOTE_REF: ${{ github.ref_name }}
      MOTE_ENVIRONMENT: production
      MOTE_WRITE_SMOKE: 'false'
      MOTE_TARGET_SHA: ${{ needs.deploy.outputs.target_sha }}
      MOTE_MANIFEST_DIGEST: ${{ needs.deploy.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mote-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-prepared
      - name: Verify deployed checkpoint and publish the existing tarball with OIDC
        run: node scripts/deploy/release-action.mjs npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-npm-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-release-result/
          if-no-files-found: warn
          retention-days: 90

  release:
    needs: [deploy, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      deployments: write
    env:
      MOTE_REF: ${{ github.ref_name }}
      MOTE_ENVIRONMENT: production
      MOTE_WRITE_SMOKE: 'false'
      MOTE_TARGET_SHA: ${{ needs.deploy.outputs.target_sha }}
      MOTE_MANIFEST_DIGEST: ${{ needs.deploy.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mote-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-prepared
      - name: Reconcile release identity and attachments without overwriting
        run: node scripts/deploy/release-action.mjs github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-release-result/
          if-no-files-found: warn
          retention-days: 90
