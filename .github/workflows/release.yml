name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Same caller-owned lock as deploy.yml, held through npm and Release finalization.
concurrency:
  group: mote-production
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      # Permission ceiling for the isolated draft-Release preflight job only.
      # The shared build and actual deployment jobs explicitly keep contents: read.
      contents: write
      actions: read
      deployments: write
    uses: ./.github/workflows/_deploy.yml
    with:
      ref: ${{ github.ref_name }}
      environment: production
      write_smoke: false

  npm:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep npm directly in release.yml, with no new Environment claim, to retain
    # the original trusted-publisher workflow identity. No Cloudflare secrets here.
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
    env:
      MOTE_REF: ${{ github.ref_name }}
      MOTE_ENVIRONMENT: production
      MOTE_WRITE_SMOKE: 'false'
      MOTE_TARGET_SHA: ${{ needs.deploy.outputs.target_sha }}
      MOTE_MANIFEST_DIGEST: ${{ needs.deploy.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mote-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-prepared
      - name: Verify deployed checkpoint and publish the existing tarball with OIDC
        run: node scripts/deploy/release-action.mjs npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-npm-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-release-result/
          if-no-files-found: warn
          retention-days: 90

  release:
    needs: [deploy, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      deployments: write
    env:
      MOTE_REF: ${{ github.ref_name }}
      MOTE_ENVIRONMENT: production
      MOTE_WRITE_SMOKE: 'false'
      MOTE_TARGET_SHA: ${{ needs.deploy.outputs.target_sha }}
      MOTE_MANIFEST_DIGEST: ${{ needs.deploy.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mote-build-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-prepared
      - name: Reconcile release identity and attachments without overwriting
        run: node scripts/deploy/release-action.mjs github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-release-result/
          if-no-files-found: warn
          retention-days: 90
