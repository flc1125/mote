name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A stable tag publishes only the CLI package and GitHub Release. Production
# Workers deploy independently from main through Cloudflare Workers Builds.
concurrency:
  group: mote-release-${{ github.ref }}
  cancel-in-progress: false

env:
  MOTE_TARGET_SHA: ${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate stable tag, build, pack and test the CLI package
        run: >-
          node scripts/release/prepare.mjs
          --tag "${{ github.ref_name }}"
          --sha "${{ github.sha }}"
          --out "${{ runner.temp }}/mote-release"
      - id: manifest
        name: Record the verified release manifest digest
        shell: bash
        run: echo "digest=$(shasum -a 256 '${{ runner.temp }}/mote-release/release-manifest.json' | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mote-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-release/
          if-no-files-found: error
          retention-days: 30

  preflight:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      MOTE_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: mote-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-release
      - name: Check npm, tag and existing GitHub Release identities without writing
        run: node scripts/release/action.mjs preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}

  npm:
    needs: [prepare, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      MOTE_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: mote-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-release
      - name: Publish the verified tarball with npm Trusted Publishing
        run: node scripts/release/action.mjs npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-npm-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-release-result/
          if-no-files-found: warn
          retention-days: 90

  release:
    needs: [prepare, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      MOTE_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: mote-release-${{ github.run_id }}
          path: ${{ runner.temp }}/mote-release
      - name: Create or reconcile the GitHub Release without overwriting assets
        run: node scripts/release/action.mjs github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mote-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mote-release-result/
          if-no-files-found: warn
          retention-days: 90
