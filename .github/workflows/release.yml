name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm OIDC Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Tag version must match the CLI package version (tag v0.1.1 ↔ 0.1.1).
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./apps/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION != apps/cli package.json $PKG_VERSION" >&2
            exit 1
          fi

      - run: pnpm --filter @mote/cli build

      # pnpm pack rewrites workspace:* protocols in the tarball manifest;
      # publishing the tarball keeps npm free of workspace references.
      - name: Pack the CLI
        working-directory: apps/cli
        run: pnpm pack

      # Everything fallible is validated BEFORE the irreversible npm publish.
      - name: Extract changelog notes for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[$VERSION\]/{flag=1;next} /^## \[/{if(flag)exit} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for $VERSION in CHANGELOG.md" >&2
            exit 1
          fi

      # npm >= 11.5.1 is required for OIDC Trusted Publishing.
      - run: npm install -g npm@latest

      # Idempotent: a rerun after a failed release step must not die here —
      # a name@version on npm can never be published twice.
      - name: Publish to npm (OIDC Trusted Publishing)
        working-directory: apps/cli
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "mote-cli@$VERSION" version >/dev/null 2>&1; then
            echo "mote-cli@$VERSION already published, skipping"
          else
            npm publish mote-cli-*.tgz --access public
          fi

      # Idempotent: update in place when the release already exists.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" apps/cli/mote-cli-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md apps/cli/mote-cli-*.tgz
          fi
