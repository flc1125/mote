name: Shared test secret availability probe

on:
  workflow_call:

permissions: {}

jobs:
  probe:
    if: >-
      github.repository == 'flc1125/mote' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'flc1125/mote/.github/workflows/diagnose-secrets.yml@refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: access-test
    steps:
      - name: Report reusable-task secret presence
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          case "$TOKEN_PRESENT" in
            true|false) printf '%s\n' "$TOKEN_PRESENT" ;;
            *) exit 1 ;;
          esac
