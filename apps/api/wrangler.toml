name = "mote-api"
main = "src/index.ts"
# See apps/viewer/wrangler.toml for why this date is pinned.
compatibility_date = "2026-08-15"
workers_dev = false
preview_urls = false

# Path-based routing: most specific route wins over the Viewer's
# mote.pub/*, so /api/* requests execute only this Worker.
routes = [{ pattern = "mote.pub/api/*", zone_name = "mote.pub" }]

# No [cache] here: the API must never be cached (baseline §8.2).

# Public base URL used to build document URLs in publish responses.
[vars]
VIEWER_BASE_URL = "https://mote.pub"
MOTE_AUTH_MODE = "cloudflare-access"
# Production Access application; these identifiers are not credentials.
MOTE_ACCESS_ISSUER = "https://flc1125.cloudflareaccess.com"
MOTE_ACCESS_AUD = "d3f4ebddb8b5bb4e6c25da00efcfc4c1f33e7055e9454c2a3e39707fef8e131c"
MOTE_ACCESS_HOSTNAME = "mote.pub"

# MOTE_TOKEN is a secret, set via `wrangler secret put` (baseline §38),
# never in this file.

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "mote-documents"

# Isolated verification; uses a separate Access application, host and bucket.
# Deploy only after environment approval: wrangler deploy --env access-test
[env.access-test]
name = "mote-test-api"
account_id = "c585cb4fcca22909dbaae2e3072a7a8b"
workers_dev = false
preview_urls = false
routes = [{ pattern = "mote-test.flc.io/api/*", zone_name = "flc.io" }]

[env.access-test.vars]
VIEWER_BASE_URL = "https://mote-test.flc.io"
MOTE_AUTH_MODE = "cloudflare-access"
MOTE_ACCESS_ISSUER = "https://flc1125.cloudflareaccess.com"
MOTE_ACCESS_AUD = "d4a8fb385f160677a736f54466c781d99b4806ae6b85d7d752c27ceda51ab859"
MOTE_ACCESS_HOSTNAME = "mote-test.flc.io"

[[env.access-test.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "mote-test-documents"
